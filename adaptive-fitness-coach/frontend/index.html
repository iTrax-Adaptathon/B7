<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adaptive Fitness Coach — Your Workout Adapts to You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Outfit', sans-serif;
      --bg-primary: #0b0f17;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.85);
      --bg-input: #1e293b;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(56, 189, 248, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      --color-progress: #10b981;
      --color-progress-bg: rgba(16, 185, 129, 0.15);
      --color-hold: #f59e0b;
      --color-hold-bg: rgba(245, 158, 11, 0.15);
      --color-backoff: #f43f5e;
      --color-backoff-bg: rgba(244, 63, 94, 0.15);
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      background: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.06) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.06) 0%, transparent 40%),
                  var(--bg-primary);
    }
    h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 700; letter-spacing: -0.02em; }
    
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.85rem; }
    .btn-lg { padding: 0.95rem 1.75rem; font-size: 1.05rem; }

    .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); }
    .form-input, .form-select, .form-textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      outline: none;
      width: 100%;
      font-size: 0.95rem;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-progress { background: var(--color-progress-bg); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--color-progress); }
    .badge-hold { background: var(--color-hold-bg); border: 1px solid rgba(245, 158, 11, 0.4); color: var(--color-hold); }
    .badge-backoff { background: var(--color-backoff-bg); border: 1px solid rgba(244, 63, 94, 0.4); color: var(--color-backoff); }
    .badge-neutral { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-secondary); }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
    }
    .modal-content {
      background: #131d2e; border: 1px solid var(--border-highlight); border-radius: var(--radius-lg);
      padding: 2rem; max-width: 620px; width: 100%; max-height: 90vh; overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header style="background: rgba(11, 15, 23, 0.9); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0.85rem 1.5rem; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 0.65rem; cursor: pointer;" onclick="navigateView('dashboard')">
        <div style="width: 36px; height: 36px; borderRadius: 10px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; border-radius: 8px;">⚡</div>
        <div>
          <span style="font-family: var(--font-heading); font-weight: 800; font-size: 1.2rem; color: #fff;">
            Adaptive<span style="color: var(--accent-cyan);">Coach</span>
          </span>
          <span style="display: block; font-size: 0.65rem; color: var(--text-muted); line-height: 1;">Your workout adapts to you</span>
        </div>
      </div>

      <nav id="nav-buttons" style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn btn-secondary btn-sm" onclick="navigateView('dashboard')">Dashboard</button>
        <button class="btn btn-secondary btn-sm" onclick="navigateView('workout')">Workout</button>
        <button class="btn btn-secondary btn-sm" onclick="navigateView('history')">History</button>
        <button class="btn btn-secondary btn-sm" onclick="navigateView('progress')">Progress</button>
        <button class="btn btn-secondary btn-sm" onclick="navigateView('profile')">Settings</button>
        <button class="btn btn-secondary btn-sm" onclick="navigateView('login')">🔑 Login</button>
        <button class="btn btn-primary btn-sm" onclick="navigateView('register')">✨ Register</button>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-container" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; min-height: 80vh;"></main>

  <!-- Modals Container -->
  <div id="modal-container"></div>

  <script>
    // --- APP STATE & ENGINE ---
    const STATE = {
      view: 'dashboard',
      isLoggedIn: true,
      profile: {
        name: 'User',
        age: 28,
        height: 178,
        weight: 74,
        experience: 'INTERMEDIATE',
        fitness_goal: 'BUILD_STRENGTH',
        focus_areas: ['Full Body', 'Upper Body'],
        equipment: ['Dumbbells', 'Bench'],
        gym_access: false,
        days_per_week: 4,
        workout_duration: 30,
        progression_method: 'FIXED',
        progression_value: 2.5
      },
      latestAdaptation: {
        adaptation_score: 82,
        decision: 'PROGRESS',
        performance_component: 85,
        rep_completion_component: 90,
        rpe_difficulty_component: 75,
        recovery_component: 80,
        consistency_component: 85,
        explanation: 'Your recent performance shows strong target repetition completion and solid recovery readiness. The next workout increases the target load slightly.'
      },
      history: [
        {
          id: 1,
          workout_name: "User's Strength Session",
          date: '2026-09-12',
          difficulty_rating: 3,
          energy_rating: 4,
          recovery_rating: 4,
          adaptation_decision: 'PROGRESS',
          exercises: [
            { name: 'Dumbbell Row', weight: 15, reps: 10, sets: 3, rpe: 7 },
            { name: 'Push-up', is_bodyweight: true, reps: 12, sets: 3, rpe: 6.5 }
          ]
        }
      ],
      currentWorkout: null,
      workoutTimerSec: 0,
      timerInterval: null
    };

    const EXERCISES_DB = [
      { id: 1, name: "Push-up", bodyweight: true, equipment: [], target: "Upper Body", defaultSets: 3, defaultReps: 10, instructions: "Keep hands shoulder-width apart, maintain rigid core, lower chest until near floor." },
      { id: 2, name: "Bodyweight Squat", bodyweight: true, equipment: [], target: "Lower Body", defaultSets: 3, defaultReps: 12, instructions: "Feet shoulder-width apart, squat hips down and back below parallel, drive through heels." },
      { id: 3, name: "Reverse Lunge", bodyweight: true, equipment: [], target: "Lower Body", defaultSets: 3, defaultReps: 10, instructions: "Step back into 90-degree knee bend, press through front heel to return." },
      { id: 4, name: "Plank", bodyweight: true, equipment: [], target: "Core", defaultSets: 3, defaultDuration: 30, instructions: "Forearm plank position, brace abdominals, keep body straight from head to heels." },
      { id: 5, name: "Glute Bridge", bodyweight: true, equipment: [], target: "Lower Body", defaultSets: 3, defaultReps: 15, instructions: "Lie on back, bend knees, squeeze glutes to press hips toward ceiling." },
      { id: 6, name: "Dumbbell Row", bodyweight: false, equipment: ["Dumbbells"], target: "Upper Body", defaultSets: 3, defaultReps: 10, instructions: "Hinge at hips with flat spine, row dumbbells to lower ribs with elbow drive." },
      { id: 7, name: "Dumbbell Shoulder Press", bodyweight: false, equipment: ["Dumbbells"], target: "Upper Body", defaultSets: 3, defaultReps: 10, instructions: "Press dumbbells overhead from shoulder level until elbows lock out smoothly." },
      { id: 8, name: "Goblet Squat", bodyweight: false, equipment: ["Dumbbells"], target: "Lower Body", defaultSets: 3, defaultReps: 10, instructions: "Hold dumbbell vertically against sternum, squat deep and rise powerfully." },
      { id: 9, name: "Dumbbell Bench Press", bodyweight: false, equipment: ["Dumbbells", "Bench"], target: "Upper Body", defaultSets: 3, defaultReps: 10, instructions: "Lie on bench, press dumbbells up over chest with controlled tempo." },
      { id: 10, name: "Barbell Squat", bodyweight: false, equipment: ["Barbell"], target: "Lower Body", defaultSets: 3, defaultReps: 8, instructions: "Rest bar on upper traps, squat with chest upright, drive upward." },
      { id: 11, name: "Bench Press", bodyweight: false, equipment: ["Barbell", "Bench"], target: "Upper Body", defaultSets: 3, defaultReps: 8, instructions: "Grip bar slightly wider than shoulders, lower to mid-chest and press up." }
    ];

    function generateWorkout() {
      const userEquip = (STATE.profile.equipment || ["No Equipment"]).map(e => e.toLowerCase());
      const hasGym = STATE.profile.gym_access;

      const compatible = EXERCISES_DB.filter(ex => {
        if (hasGym) return true;
        if (ex.bodyweight || ex.equipment.length === 0) return true;
        if (userEquip.includes("no equipment")) return false;
        return ex.equipment.every(req => userEquip.some(ue => ue.includes(req.toLowerCase()) || req.toLowerCase().includes(ue)));
      });

      const count = STATE.profile.workout_duration <= 20 ? 3 : 4;
      const chosen = compatible.slice(0, count);

      const exercises = chosen.map((ex, idx) => {
        let suggestedWeight = null;
        let targetReps = ex.defaultReps || 10;
        let targetDuration = ex.defaultDuration || null;

        if (!ex.bodyweight) {
          let baseWeight = 20;
          if (STATE.profile.progression_method === "PERCENTAGE") {
            const perc = STATE.profile.progression_value || 5;
            baseWeight = STATE.latestAdaptation.decision === "PROGRESS" ? baseWeight * (1 + perc / 100) : (STATE.latestAdaptation.decision === "BACK_OFF" ? baseWeight * (1 - perc / 100) : baseWeight);
          } else {
            const inc = STATE.profile.progression_value || 2.5;
            baseWeight = STATE.latestAdaptation.decision === "PROGRESS" ? baseWeight + inc : (STATE.latestAdaptation.decision === "BACK_OFF" ? baseWeight - inc : baseWeight);
          }
          suggestedWeight = Math.max(0, Math.round(baseWeight * 2) / 2);
        } else {
          if (targetDuration) {
            targetDuration = STATE.latestAdaptation.decision === "PROGRESS" ? targetDuration + 5 : (STATE.latestAdaptation.decision === "BACK_OFF" ? Math.max(15, targetDuration - 5) : targetDuration);
          } else {
            targetReps = STATE.latestAdaptation.decision === "PROGRESS" ? targetReps + 2 : (STATE.latestAdaptation.decision === "BACK_OFF" ? Math.max(6, targetReps - 2) : targetReps);
          }
        }

        return {
          id: idx + 1,
          exercise: ex,
          target_sets: ex.defaultSets || 3,
          target_reps: targetReps,
          target_duration: targetDuration,
          suggested_weight: suggestedWeight,
          completed_sets: 0
        };
      });

      STATE.currentWorkout = {
        name: `${STATE.profile.name}'s Adaptive Session`,
        focus: STATE.profile.focus_areas.join(', '),
        duration: STATE.profile.workout_duration,
        exercises
      };
    }

    function evaluateAdaptiveEngine(diff, energy, rec) {
      const perfScore = 85;
      const repScore = 90;
      const diffMap = { 1: 95, 2: 90, 3: 75, 4: 50, 5: 25 };
      const rpeDiff = diffMap[diff] || 75;
      const recScore = (rec * 20 + energy * 20) / 2;
      const constScore = 85;

      const score = Math.round((0.30 * perfScore) + (0.20 * repScore) + (0.20 * rpeDiff) + (0.20 * recScore) + (0.10 * constScore));

      let decision = 'HOLD';
      if (score >= 70) decision = 'PROGRESS';
      else if (score < 45) decision = 'BACK_OFF';

      let explanation = '';
      if (diff === 5 && rec <= 2) {
        decision = 'BACK_OFF';
        explanation = 'Safety override applied: High exertion and low physical recovery readiness requires a restorative deload session.';
      } else if (decision === 'PROGRESS') {
        explanation = `Your performance shows strong target completion and high recovery (Score: ${score}/100). The engine is advancing your target load for the next session.`;
      } else if (decision === 'HOLD') {
        explanation = `Your performance is steady, but recovery readiness suggests consolidating current targets (Score: ${score}/100).`;
      } else {
        explanation = `Fatigue signals detected (Score: ${score}/100). The next session conservatively reduces target loads to support adaptation.`;
      }

      STATE.latestAdaptation = {
        adaptation_score: score,
        decision,
        performance_component: perfScore,
        rep_completion_component: repScore,
        rpe_difficulty_component: rpeDiff,
        recovery_component: recScore,
        consistency_component: constScore,
        explanation
      };
    }

    // --- NAVIGATION & VIEWS ---
    function navigateView(v) {
      STATE.view = v;
      if (!STATE.currentWorkout) generateWorkout();
      renderApp();
    }

    function renderApp() {
      const container = document.getElementById('app-container');
      if (STATE.view === 'dashboard') renderDashboard(container);
      else if (STATE.view === 'workout') renderWorkout(container);
      else if (STATE.view === 'history') renderHistory(container);
      else if (STATE.view === 'progress') renderProgress(container);
      else if (STATE.view === 'profile') renderProfile(container);
      else if (STATE.view === 'login') renderLogin(container);
      else if (STATE.view === 'register') renderRegister(container);
    }

    function renderLogin(container) {
      container.innerHTML = `
        <div style="max-width: 420px; margin: 2rem auto;">
          <div class="glass-card" style="padding: 2.5rem 2rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
              <div style="width: 48px; height: 48px; border-radius: 12px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: #fff; font-size: 1.5rem;">
                🔑
              </div>
              <h1 style="font-size: 1.75rem; color: #fff;">User Login</h1>
              <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.35rem;">
                Sign in to your adaptive fitness session.
              </p>
            </div>

            <form onsubmit="event.preventDefault(); handleLoginSubmit();">
              <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="login-username" class="form-input" value="User" required />
              </div>

              <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="login-password" class="form-input" value="password123" required />
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Log In as User →
              </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
              Need an account? <a href="#" style="color: var(--accent-cyan); font-weight: 600;" onclick="navigateView('register')">Register</a>
            </div>
          </div>
        </div>
      `;
    }

    function handleLoginSubmit() {
      const username = document.getElementById('login-username').value.trim() || 'User';
      STATE.profile.name = username;
      STATE.isLoggedIn = true;
      generateWorkout();
      alert(`Welcome back, ${username}!`);
      navigateView('dashboard');
    }

    function renderRegister(container) {
      container.innerHTML = `
        <div style="max-width: 440px; margin: 2rem auto;">
          <div class="glass-card" style="padding: 2.5rem 2rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
              <div style="width: 48px; height: 48px; border-radius: 12px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: #fff; font-size: 1.5rem;">
                ✨
              </div>
              <h1 style="font-size: 1.75rem; color: #fff;">Register Account</h1>
              <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.35rem;">
                Create your profile to begin adaptive training.
              </p>
            </div>

            <form onsubmit="event.preventDefault(); handleRegisterSubmit();">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="reg-name" class="form-input" value="User" required />
              </div>

              <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="reg-username" class="form-input" value="User" required />
              </div>

              <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="reg-password" class="form-input" value="password123" required />
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Create Account & Start →
              </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
              Already registered? <a href="#" style="color: var(--accent-cyan); font-weight: 600;" onclick="navigateView('login')">Log In</a>
            </div>
          </div>
        </div>
      `;
    }

    function handleRegisterSubmit() {
      const name = document.getElementById('reg-name').value.trim() || 'User';
      STATE.profile.name = name;
      STATE.isLoggedIn = true;
      generateWorkout();
      alert(`Account created for ${name}!`);
      navigateView('dashboard');
    }

    function renderDashboard(container) {
      const { profile, latestAdaptation, currentWorkout, history } = STATE;
      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 2rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
              <span style="font-size: 0.85rem; color: var(--accent-cyan); font-weight: 600;">ADAPTIVE TRAINING HUB</span>
              <h1 style="font-size: 2.2rem; color: #fff; margin-top: 0.15rem;">Hello, User</h1>
              <p style="color: var(--text-secondary);">Goal: <strong>${profile.fitness_goal.replace('_', ' ')}</strong></p>
            </div>
            <div class="glass-card" style="padding: 0.75rem 1.25rem; text-align: center;">
              <span style="font-size: 0.7rem; color: var(--text-muted); display: block;">TRAINING STATUS</span>
              <span class="badge badge-${latestAdaptation.decision.toLowerCase().replace('_', '')}" style="margin-top: 0.25rem;">
                ● ${latestAdaptation.decision.replace('_', ' ')}
              </span>
            </div>
          </div>

          <!-- Hero Workout Banner -->
          <div class="glass-card" style="background: linear-gradient(135deg, rgba(17, 24, 39, 0.95), rgba(30, 41, 59, 0.85)); border: 1px solid var(--border-highlight);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1.5rem;">
              <div>
                <span class="badge badge-neutral" style="color: var(--accent-cyan); margin-bottom: 0.5rem;">
                  ⚡ Today's Adapted Session (${currentWorkout.duration} mins)
                </span>
                <h2 style="font-size: 1.8rem; color: #fff; margin-bottom: 0.4rem;">${currentWorkout.name}</h2>
                <p style="color: var(--text-secondary); margin-bottom: 1.25rem;">Focus: <strong>${currentWorkout.focus}</strong></p>

                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem;">
                  ${currentWorkout.exercises.map(we => `
                    <span style="font-size: 0.8rem; padding: 0.35rem 0.65rem; background: rgba(255,255,255,0.05); border-radius: 6px; color: #f8fafc;">
                      ${we.exercise.name} ${we.suggested_weight ? `(${we.suggested_weight}kg)` : '(Bodyweight)'}
                    </span>
                  `).join('')}
                </div>

                <div style="display: flex; gap: 0.75rem;">
                  <button class="btn btn-primary btn-lg" onclick="navigateView('workout')">▶ Start Workout</button>
                  <button class="btn btn-secondary btn-lg" onclick="generateWorkout(); renderApp();">🔄 Regenerate</button>
                </div>
              </div>

              <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.25rem; text-align: center; min-width: 200px;">
                <span style="font-size: 0.75rem; color: var(--accent-cyan); font-weight: 600;">ADAPTATION SCORE</span>
                <div style="font-size: 2.4rem; font-weight: 800; color: #fff; margin: 0.2rem 0;">
                  ${latestAdaptation.adaptation_score}<span style="font-size: 1rem; color: var(--text-muted);">/100</span>
                </div>
                <span class="badge badge-${latestAdaptation.decision.toLowerCase().replace('_', '')}">${latestAdaptation.decision}</span>
              </div>
            </div>
          </div>

          <!-- Explanation -->
          <div class="glass-card" style="border-left: 4px solid var(--accent-cyan);">
            <h4 style="font-size: 0.85rem; color: var(--accent-cyan); margin-bottom: 0.3rem;">WHY YOUR WORKOUT ADAPTED:</h4>
            <p style="color: #fff; font-size: 0.95rem; line-height: 1.5;">"${latestAdaptation.explanation}"</p>
          </div>

          <!-- Stats Grid -->
          <div class="grid-4">
            <div class="glass-card">
              <span style="font-size: 0.75rem; color: var(--text-muted);">WORKOUTS THIS WEEK</span>
              <h3 style="font-size: 1.6rem; color: #fff; margin-top: 0.2rem;">${history.length} / ${profile.days_per_week}</h3>
            </div>
            <div class="glass-card">
              <span style="font-size: 0.75rem; color: var(--text-muted);">EQUIPMENT MODE</span>
              <h3 style="font-size: 1.3rem; color: #fff; margin-top: 0.2rem;">${profile.equipment.join(', ') || 'Bodyweight'}</h3>
            </div>
            <div class="glass-card">
              <span style="font-size: 0.75rem; color: var(--text-muted);">WEIGHT PROGRESSION</span>
              <h3 style="font-size: 1.4rem; color: #fff; margin-top: 0.2rem;">+${profile.progression_value} ${profile.progression_method === 'FIXED' ? 'kg' : '%'}</h3>
            </div>
            <div class="glass-card">
              <span style="font-size: 0.75rem; color: var(--text-muted);">PHYSICAL READINESS</span>
              <h3 style="font-size: 1.6rem; color: #10b981; margin-top: 0.2rem;">4.2 / 5</h3>
            </div>
          </div>
        </div>
      `;
    }

    function renderWorkout(container) {
      const { currentWorkout } = STATE;
      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
          <div class="glass-card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
              <span class="badge badge-neutral" style="color: var(--accent-cyan);">Active Workout Execution</span>
              <h1 style="font-size: 1.8rem; color: #fff;">${currentWorkout.name}</h1>
            </div>
            <button class="btn btn-primary" onclick="openPostWorkoutModal()">✓ Finish & Submit Session</button>
          </div>

          <div style="display: flex; flex-direction: column; gap: 1.25rem;">
            ${currentWorkout.exercises.map((we, idx) => `
              <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                  <div>
                    <h3 style="font-size: 1.25rem; color: #fff;">#${idx+1}. ${we.exercise.name}</h3>
                    <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.2rem;">
                      Target: <strong>${we.target_sets} sets</strong> × <strong>${we.exercise.bodyweight ? (we.target_duration ? `${we.target_duration}s hold` : `${we.target_reps} reps`) : `${we.suggested_weight}kg × ${we.target_reps} reps`}</strong>
                    </p>
                  </div>
                  <span class="badge badge-neutral">${we.exercise.bodyweight ? 'Bodyweight' : we.exercise.equipment.join(', ')}</span>
                </div>
                
                <div style="background: rgba(255,255,255,0.02); padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
                  💡 ${we.exercise.instructions}
                </div>

                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                  ${Array.from({ length: we.target_sets }).map((_, sIdx) => `
                    <button class="btn btn-secondary btn-sm" onclick="this.style.background='#10b981'; this.style.color='#fff'; this.innerText='Set ${sIdx+1} Done ✓';">
                      Set ${sIdx+1} Done
                    </button>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
            <button class="btn btn-primary btn-lg" onclick="openPostWorkoutModal()">Submit Workout Feedback →</button>
          </div>
        </div>
      `;
    }

    function renderHistory(container) {
      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
          <h1 style="font-size: 2rem; color: #fff;">Workout History & Adaptive Decisions</h1>
          ${STATE.history.map(s => `
            <div class="glass-card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h3 style="color: #fff; font-size: 1.2rem;">${s.workout_name}</h3>
                <span class="badge badge-${s.adaptation_decision.toLowerCase().replace('_', '')}">${s.adaptation_decision}</span>
              </div>
              <div style="display: flex; gap: 1rem; font-size: 0.85rem; color: var(--text-secondary);">
                <span>Date: <strong>${s.date}</strong></span>
                <span>Difficulty: <strong>${s.difficulty_rating}/5</strong></span>
                <span>Energy: <strong>${s.energy_rating}/5</strong></span>
                <span>Recovery: <strong>${s.recovery_rating}/5</strong></span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderProgress(container) {
      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 2rem;">
          <h1 style="font-size: 2rem; color: #fff;">Progress & Overload Trends</h1>
          
          <div class="glass-card">
            <h3 style="color: #fff; margin-bottom: 1rem;">Working Weight Progression Trend</h3>
            <div style="height: 180px; width: 100%; display: flex; align-items: flex-end; gap: 1.5rem; padding: 1rem 0; border-bottom: 1px solid var(--border-color);">
              <div style="flex: 1; height: 60%; background: linear-gradient(180deg, #38bdf8, transparent); border-radius: 6px; text-align: center; color: #fff; font-weight: 700; font-size: 0.85rem; padding-top: 5px;">15 kg (Week 1)</div>
              <div style="flex: 1; height: 75%; background: linear-gradient(180deg, #38bdf8, transparent); border-radius: 6px; text-align: center; color: #fff; font-weight: 700; font-size: 0.85rem; padding-top: 5px;">17.5 kg (Week 2)</div>
              <div style="flex: 1; height: 95%; background: linear-gradient(180deg, #10b981, transparent); border-radius: 6px; text-align: center; color: #fff; font-weight: 700; font-size: 0.85rem; padding-top: 5px;">20 kg (Current)</div>
            </div>
          </div>

          <div class="grid-2">
            <div class="glass-card">
              <h3 style="color: #fff; margin-bottom: 0.5rem;">Exertion (RPE) vs Readiness</h3>
              <p style="color: var(--text-secondary); font-size: 0.9rem;">Balanced strain-to-recovery ratio indicates progressive overload headroom.</p>
            </div>
            <div class="glass-card">
              <h3 style="color: #fff; margin-bottom: 0.5rem;">Engine Decision Distribution</h3>
              <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                <span class="badge badge-progress">PROGRESS: 75%</span>
                <span class="badge badge-hold">HOLD: 25%</span>
                <span class="badge badge-backoff">BACK OFF: 0%</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderProfile(container) {
      const { profile } = STATE;
      container.innerHTML = `
        <div class="glass-card" style="max-width: 650px; margin: 0 auto;">
          <h2 style="font-size: 1.6rem; color: #fff; margin-bottom: 1.5rem;">Profile & Equipment Settings</h2>
          
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="prof-name" class="form-input" value="User">
          </div>

          <div class="form-group">
            <label class="form-label">Weight Progression Method</label>
            <select id="prof-method" class="form-select">
              <option value="FIXED" ${profile.progression_method === 'FIXED' ? 'selected' : ''}>Fixed Weight (+2.5 kg)</option>
              <option value="PERCENTAGE" ${profile.progression_method === 'PERCENTAGE' ? 'selected' : ''}>Percentage (+5%)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Available Equipment</label>
            <select id="prof-equip" class="form-select">
              <option value="No Equipment" ${profile.equipment[0] === 'No Equipment' ? 'selected' : ''}>No Equipment (Bodyweight Only)</option>
              <option value="Dumbbells" ${profile.equipment[0] === 'Dumbbells' ? 'selected' : ''}>Dumbbells</option>
              <option value="Barbell" ${profile.equipment[0] === 'Barbell' ? 'selected' : ''}>Barbell</option>
              <option value="Dumbbells, Bench" ${profile.equipment.includes('Bench') ? 'selected' : ''}>Dumbbells + Bench</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Target Workouts per Week</label>
            <select id="prof-days" class="form-select">
              <option value="3" ${profile.days_per_week === 3 ? 'selected' : ''}>3 Days/week</option>
              <option value="4" ${profile.days_per_week === 4 ? 'selected' : ''}>4 Days/week</option>
              <option value="5" ${profile.days_per_week === 5 ? 'selected' : ''}>5 Days/week</option>
            </select>
          </div>

          <button class="btn btn-primary" style="margin-top: 0.5rem;" onclick="saveProfileSettings()">Save Preferences</button>
        </div>
      `;
    }

    function saveProfileSettings() {
      STATE.profile.name = document.getElementById('prof-name').value;
      STATE.profile.progression_method = document.getElementById('prof-method').value;
      const equip = document.getElementById('prof-equip').value;
      STATE.profile.equipment = equip.split(', ');
      STATE.profile.days_per_week = parseInt(document.getElementById('prof-days').value);

      generateWorkout();
      alert('Settings saved and upcoming workout adapted!');
      navigateView('dashboard');
    }

    // --- MODALS ---
    function openPostWorkoutModal() {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-content">
            <h2 style="color: #fff; margin-bottom: 0.5rem;">Rate Workout & Recovery</h2>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.5rem;">Your signals directly drive the next adaptive workout.</p>
            
            <div class="form-group">
              <label class="form-label">Perceived Workout Difficulty (1: Very Easy to 5: Very Hard)</label>
              <select id="feed-diff" class="form-select">
                <option value="1">1 — Very Easy</option>
                <option value="2">2 — Easy</option>
                <option value="3" selected>3 — Moderate</option>
                <option value="4">4 — Hard</option>
                <option value="5">5 — Very Hard</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Energy Level (1: Very Low to 5: Excellent)</label>
              <select id="feed-energy" class="form-select">
                <option value="1">1 — Very Low</option>
                <option value="2">2 — Low</option>
                <option value="3">3 — Moderate</option>
                <option value="4" selected>4 — Good</option>
                <option value="5">5 — Excellent</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Physical Recovery Readiness (1: Poor to 5: Fully Recovered)</label>
              <select id="feed-rec" class="form-select">
                <option value="1">1 — Very Poor</option>
                <option value="2">2 — Poor</option>
                <option value="3">3 — Moderate</option>
                <option value="4" selected>4 — Good</option>
                <option value="5">5 — Excellent</option>
              </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.25rem;">
              <button class="btn btn-secondary" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
              <button class="btn btn-primary" onclick="submitWorkoutFeedback()">Submit & Adapt Next Workout</button>
            </div>
          </div>
        </div>
      `;
    }

    function submitWorkoutFeedback() {
      const diff = parseInt(document.getElementById('feed-diff').value);
      const energy = parseInt(document.getElementById('feed-energy').value);
      const rec = parseInt(document.getElementById('feed-rec').value);

      evaluateAdaptiveEngine(diff, energy, rec);

      // Add to history
      STATE.history.unshift({
        id: Date.now(),
        workout_name: STATE.currentWorkout.name,
        date: new Date().toLocaleDateString(),
        difficulty_rating: diff,
        energy_rating: energy,
        recovery_rating: rec,
        adaptation_decision: STATE.latestAdaptation.decision
      });

      // Regenerate next workout based on new decision
      generateWorkout();

      // Show result modal
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-content" style="text-align: center;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">⚡</div>
            <h2 style="color: #fff;">Adaptive Engine Calibration Complete</h2>
            
            <div style="margin: 1rem 0;">
              <span class="badge badge-${STATE.latestAdaptation.decision.toLowerCase().replace('_', '')}" style="font-size: 1rem; padding: 0.5rem 1rem;">
                ● ${STATE.latestAdaptation.decision.replace('_', ' ')}
              </span>
            </div>

            <div style="font-size: 1.8rem; font-weight: 800; color: var(--accent-cyan); margin-bottom: 1rem;">
              Score: ${STATE.latestAdaptation.adaptation_score} / 100
            </div>

            <p style="color: #fff; font-size: 0.95rem; background: rgba(56, 189, 248, 0.08); padding: 1rem; border-radius: 8px; text-align: left; margin-bottom: 1.5rem; line-height: 1.5;">
              "${STATE.latestAdaptation.explanation}"
            </p>

            <button class="btn btn-primary btn-lg" onclick="document.getElementById('modal-container').innerHTML=''; navigateView('dashboard');">
              View Next Adapted Workout →
            </button>
          </div>
        </div>
      `;
    }

    // Initialize
    generateWorkout();
    renderApp();
  </script>
</body>
</html>
